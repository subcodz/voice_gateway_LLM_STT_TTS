  # 12. Complaint Status Inquiry (PERSONALIZED - Never Cached in Semantic Cache)
  - id: "complaint_status"
    personal: true
    languages:
      bn-IN:
        canonical_reply: "আপনার অভিযোগ নম্বর সি-৮৯২ এর কাজ চলছে। টেকনিশিয়ান পৌঁছানোর আনুমানিক সময় ৩০ মিনিট।"
