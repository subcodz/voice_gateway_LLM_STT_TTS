          - "হেল্পলাইন ফোন নাম্বার চাই"
      hi-IN:
        canonical_reply: "हमारा टोल-फ्री हेल्पलाइन नंबर १९१२ है। आप चौबीसों घंटे किसी भी समय संपर्क कर सकते हैं।"
        examples:
          - "कस्टमर केयर नंबर क्या है?"
          - "हेल्पलाइन नंबर दीजिए"
      hi-en:
        canonical_reply: "Amader toll-free helpline number holo 1912. 24x7 call korte paren."
        examples:
