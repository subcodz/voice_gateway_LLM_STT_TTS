<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 20 250 250" width="100%" height="100%">
  <!-- Back Card -->
  <rect x="100" y="70" width="120" height="120" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="4" transform="rotate(45 160 130)" />

  <!-- Middle Card -->
  <rect x="130" y="85" width="120" height="120" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="4" transform="rotate(45 190 145)" />

  <!-- Front Card -->
  <rect x="160" y="100" width="120" height="120" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="4" transform="rotate(45 220 160)" />

  <!-- Face Elements (Aligned upright) -->
  <!-- Left Eye -->
  <circle cx="203" cy="155" r="4.5" fill="#222222" />
  
  <!-- Right Eye -->
  <circle cx="237" cy="155" r="4.5" fill="#222222" />
  
  <!-- Smile -->
  <path d="M 210,170 Q 220,182 230,170" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" />
</svg>
